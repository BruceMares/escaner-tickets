name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  calidad:
    name: Lint y revisión de tipos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Linter (ESLint)
        run: npm run lint
      - name: Errores de sintaxis y tipos (TypeScript)
        run: npm run typecheck

  commits:
    name: Formato de commits (feat:, fix:, ...)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar commitlint
        run: npm install --no-save --no-package-lock @commitlint/cli@19 @commitlint/config-conventional@19
      # En un Pull Request se revisan todos sus commits.
      - name: Revisar los commits del Pull Request
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      # En una subida directa se revisa el último commit (funciona aunque se reescriba la historia).
      - name: Revisar el último commit
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose
